<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人資料</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .error {
            color: red;
            font-size: 14px;
        }
        .profile-photo {
            max-width: 150px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div id="flask-flash-messages" style="display: none;">
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
                <div class="flash-message">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
    </div>
    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.9/babel.min.js"></script>

    {% raw %}
    <script type="text/babel">
        const { useState, useEffect } = React;

        function ProfileForm() {
            const [flashMessages, setFlashMessages] = useState([]);
            const [name, setName] = useState("");
            const [birthYear, setBirthYear] = useState("");
            const [birthMonth, setBirthMonth] = useState("");
            const [birthDate, setBirthDate] = useState("");
            const [gender, setGender] = useState("");
            const [sexOrientationId, setSexOrientationId] = useState("");
            const [height, setHeight] = useState("");
            const [bio, setBio] = useState("");
            const [interests, setInterests] = useState("");
            const [musicGenreId, setMusicGenreId] = useState("");
            const [mbti, setMbti] = useState("");
            const [error, setError] = useState("");
            const [photo, setPhoto] = useState(null);
            const [isProfilePhoto, setIsProfilePhoto] = useState(false);
            const [currentProfilePhoto, setCurrentProfilePhoto] = useState("");

            // 載入 flash 訊息
            useEffect(() => {
                const flashContainer = document.getElementById('flask-flash-messages');
                const messages = Array.from(flashContainer.getElementsByClassName('flash-message'))
                    .map(el => el.textContent);
                setFlashMessages(messages);
            }, []);

            // 載入用戶資料
            useEffect(() => {
                async function fetchUserProfile() {
                    try {
                        const response = await fetch('/get_user_profile');
                        const data = await response.json();
                        if (response.ok && data) {
                            setName(data.name || "");
                            setBirthYear(data.birth_year || "");
                            setBirthMonth(data.birth_month || "");
                            setBirthDate(data.birth_date || "");
                            setGender(data.gender || "");
                            setSexOrientationId(data.sex_orientation_id || "");
                            setHeight(data.height || "");
                            setBio(data.bio || "");
                            setInterests(data.interests ? data.interests.join(", ") : "");
                            setMusicGenreId(data.music_genre_id || "");
                            setMbti(data.mbti || "");
                        }
                    } catch (error) {
                        console.error('載入用戶資料時發生錯誤:', error);
                        setError('載入用戶資料失敗');
                    }
                }
                fetchUserProfile();
            }, []);

            const musicGenres = [
                { id: 1, name: "西洋" },
                { id: 2, name: "聽團" },
                { id: 3, name: "K-pop" },
                { id: 4, name: "流行" },
                { id: 5, name: "古典" },
                { id: 6, name: "爵士" },
                { id: 7, name: "嘻哈" },
                { id: 8, name: "電子" },
                { id: 9, name: "鄉村" },
                { id: 10, name: "R&B" },
            ];
            const sexOrientations = [
                { id: 1, name: "異性戀" },
                { id: 2, name: "同性戀" },
                { id: 3, name: "雙性戀" },
                { id: 4, name: "泛性戀" },
                { id: 5, name: "無性戀" },
                { id: 6, name: "其他" },
            ];

            // 載入當前頭像
            useEffect(() => {
                async function fetchProfilePhoto() {
                    try {
                        const response = await fetch('/get_profile_photo');
                        const data = await response.json();
                        if (response.ok && data.photo_url !== undefined) {
                            setCurrentProfilePhoto(data.photo_url || "");
                        } else {
                            setCurrentProfilePhoto("");
                            if (data.error) {
                                console.warn('頭像載入錯誤:', data.error);
                            }
                        }
                    } catch (error) {
                        console.error('載入頭像時發生錯誤:', error);
                        setCurrentProfilePhoto("");
                    }
                }
                fetchProfilePhoto();
            }, []);

            const handlePhotoChange = (e) => {
                setPhoto(e.target.files[0]);
            };

            const uploadPhoto = async () => {
                if (!photo) return null;
                const formData = new FormData();
                formData.append('photo', photo);
                formData.append('is_profile_photo', isProfilePhoto ? 1 : 0);

                try {
                    const response = await fetch('/upload_photo', {
                        method: 'POST',
                        body: formData,
                    });
                    const data = await response.json();
                    if (response.ok) {
                        return data.photo_url;
                    } else {
                        throw new Error(data.error || '上傳照片失敗');
                    }
                } catch (err) {
                    setError('上傳照片失敗: ' + err.message);
                    return null;
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError("");

                if (!name || !birthYear || !birthMonth || !birthDate || !gender || !sexOrientationId || !height || !musicGenreId) {
                    setError("請填寫所有必填欄位");
                    return;
                }
                if (isNaN(height) || height <= 0) {
                    setError("請輸入有效的身高");
                    return;
                }

                // 先上傳照片（如果有）
                let photoUrl = null;
                if (photo) {
                    photoUrl = await uploadPhoto();
                    if (!photoUrl) return; // 上傳失敗，停止提交
                }

                try {
                    const res = await fetch("/save_profile", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            name,
                            birth_year: parseInt(birthYear),
                            birth_month: parseInt(birthMonth),
                            birth_date: parseInt(birthDate),
                            gender,
                            sex_orientation_id: parseInt(sexOrientationId),
                            height: parseInt(height),
                            bio,
                            interests: interests ? interests.split(",").map((s) => s.trim()) : [],
                            music_genre_id: parseInt(musicGenreId),
                            mbti,
                            photo_url: photoUrl, // 如果有新照片，傳遞 URL
                        }),
                    });

                    const data = await res.json();
                    
                    if (res.ok) {
                        alert("已儲存成功！");
                        // 重新載入用戶資料
                        window.location.reload(); // 重新載入頁面以確保所有資料都更新
                    } else {
                        setError(data.error || "儲存失敗，請稍後再試");
                    }
                } catch (err) {
                    console.error('儲存資料時發生錯誤:', err);
                    setError("儲存失敗，請檢查網路連線並稍後再試");
                }
            };

            return (
                <div className="profile-container">
                    <h2 className="profile-title">編輯個人資料</h2>
                    {flashMessages.map((message, index) => (
                        <div key={index} className="flash-message">{message}</div>
                    ))}
                    <div className="profile-form">
                        {error && <p className="error">{error}</p>}
                        
                        <div className="form-note">
                            <span className="required-star">*</span> 為必填欄位
                        </div>
                        
                        {currentProfilePhoto && (
                            <div className="current-photo-container">
                                <label>當前頭像：</label>
                                <img src={currentProfilePhoto} alt="頭像" className="profile-photo" />
                            </div>
                        )}

                        <form onSubmit={handleSubmit}>
                            <div className="photo-upload-group">
                                <label>上傳頭像照片：</label>
                                <input
                                    type="file"
                                    onChange={handlePhotoChange}
                                    accept="image/*"
                                />
                                <div className="photo-checkbox-container">
                                    <input
                                        type="checkbox"
                                        id="isProfilePhoto"
                                        checked={isProfilePhoto}
                                        onChange={(e) => setIsProfilePhoto(e.target.checked)}
                                    />
                                    <label htmlFor="isProfilePhoto">設為頭像</label>
                                </div>
                            </div>

                            <div className="form-group">
                                <label>姓名：<span className="required-star">*</span></label>
                                <input
                                    type="text"
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    required
                                />
                            </div>
                            <div className="form-group">
                                <label>生日：<span className="required-star">*</span></label>
                                <input
                                    type="number"
                                    placeholder="年"
                                    value={birthYear}
                                    onChange={(e) => setBirthYear(e.target.value)}
                                    min="1900"
                                    max="2025"
                                    required
                                    style={{ width: "80px" }}
                                /> 年
                                <input
                                    type="number"
                                    placeholder="月"
                                    value={birthMonth}
                                    onChange={(e) => setBirthMonth(e.target.value)}
                                    min="1"
                                    max="12"
                                    required
                                    style={{ width: "60px" }}
                                /> 月
                                <input
                                    type="number"
                                    placeholder="日"
                                    value={birthDate}
                                    onChange={(e) => setBirthDate(e.target.value)}
                                    min="1"
                                    max="31"
                                    required
                                    style={{ width: "60px" }}
                                /> 日
                            </div>
                            <div className="form-group">
                                <label>性別：<span className="required-star">*</span></label>
                                <select value={gender} onChange={(e) => setGender(e.target.value)} required>
                                    <option value="">請選擇</option>
                                    <option value="male">男性</option>
                                    <option value="female">女性</option>
                                    <option value="other">其他</option>
                                </select>
                            </div>
                            <div className="form-group">
                                <label>性向：<span className="required-star">*</span></label>
                                <select value={sexOrientationId} onChange={(e) => setSexOrientationId(e.target.value)} required>
                                    <option value="">請選擇</option>
                                    {sexOrientations.map((s) => (
                                        <option key={s.id} value={s.id}>{s.name}</option>
                                    ))}
                                </select>
                            </div>
                            <div className="form-group">
                                <label>身高（公分）：<span className="required-star">*</span></label>
                                <input
                                    type="number"
                                    value={height}
                                    onChange={(e) => setHeight(e.target.value)}
                                    min="1"
                                    required
                                />
                            </div>
                            <div className="form-group">
                                <label>自我介紹：</label>
                                <textarea
                                    value={bio}
                                    onChange={(e) => setBio(e.target.value)}
                                    rows="3"
                                    placeholder="選填"
                                />
                            </div>
                            <div className="form-group">
                                <label>興趣（用逗號分隔）：</label>
                                <input
                                    type="text"
                                    value={interests}
                                    onChange={(e) => setInterests(e.target.value)}
                                    placeholder="選填，例如：看電影, 聽音樂, 旅遊"
                                />
                            </div>
                            <div className="form-group">
                                <label>喜歡的音樂類型：<span className="required-star">*</span></label>
                                <select
                                    value={musicGenreId}
                                    onChange={(e) => setMusicGenreId(e.target.value)}
                                    required
                                >
                                    <option value="">請選擇音樂類型</option>
                                    {musicGenres.map((g) => (
                                        <option key={g.id} value={g.id}>{g.name}</option>
                                    ))}
                                </select>
                            </div>
                            <div className="form-group">
                                <label>MBTI：</label>
                                <input
                                    type="text"
                                    value={mbti}
                                    onChange={(e) => setMbti(e.target.value)}
                                    placeholder="選填，例如：INTJ、ENFP..."
                                />
                            </div>
                            <div className="form-group">
                                <button type="submit" className="submit-button">儲存</button>
                            </div>
                        </form>
                        <div className="nav-buttons-container">
                            <div className="nav-buttons">
                                <a href="/" className="nav-button">回首頁</a>
                                <a href="/logout" className="nav-button">登出</a>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<ProfileForm />);
    </script>
    {% endraw %}
</body>
</html>
